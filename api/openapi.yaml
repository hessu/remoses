openapi: 3.0.3

info:
  title: remoses
  version: 0.1.0
  description: |
    Remote control of amateur radio transceivers.

    remoses runs next to the radios and exposes frequency, mode, filter, power,
    PTT and CW sending over HTTP, with a WebSocket stream of state changes.

    ## Authentication

    HTTP Basic on every request, over TLS. Authorisation is per instance: any
    authenticated user may use any radio.

    ## Locking

    Exclusive control is per radio. Acquire a lock, then pass its token in the
    `X-Remoses-Lock` header on every state-changing request. The lease slides:
    any accepted command renews it. Reads and the WebSocket need no lock.

    If a lock expires or is released while the radio is transmitting, remoses
    drops PTT and flushes the CW queue. A client that crashes mid-transmission
    must not leave a carrier up.

servers:
  - url: /api/v1

security:
  - basicAuth: []

tags:
  - name: radios
  - name: control
  - name: cw
  - name: lock
  - name: stream

paths:
  /radios:
    get:
      tags: [radios]
      operationId: listRadios
      summary: List configured radios
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Radio" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /radios/{radioId}:
    parameters:
      - $ref: "#/components/parameters/RadioId"
    get:
      tags: [radios]
      operationId: getRadio
      summary: Radio descriptor, capabilities and configured limits
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Radio" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /radios/{radioId}/state:
    parameters:
      - $ref: "#/components/parameters/RadioId"
    get:
      tags: [control]
      operationId: getState
      summary: Cached state snapshot
      description: |
        Served from the session's state cache, so it never blocks on the serial
        port and always succeeds for a configured radio. A disconnected radio is
        reported through `connected: false` rather than an error status — the
        last known state is still useful, and the client needs to distinguish
        "no such radio" from "radio unplugged". `age_ms` says how old the
        snapshot is; `stale` is set when the poller has not refreshed it within
        the expected interval.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/State" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

    patch:
      tags: [control]
      operationId: patchState
      summary: Set one or more state fields atomically
      description: |
        The primary control verb. Fields are applied in a rig-safe order — mode
        before frequency, because mode selection can change the filter and
        carrier offset — so "14.025 CW" is one transaction rather than two
        racing requests.

        After applying the write, remoses reads back from the rig before
        responding, so the response reflects reality rather than intent. Rigs
        silently clamp: per-band power limits, unsupported filter slots.
      parameters:
        - $ref: "#/components/parameters/LockToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StatePatch" }
      responses:
        "200":
          description: Applied, with state as read back from the rig
          content:
            application/json:
              schema: { $ref: "#/components/schemas/State" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/LockConflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "423": { $ref: "#/components/responses/Locked" }
        "503": { $ref: "#/components/responses/Disconnected" }
        "504": { $ref: "#/components/responses/RigTimeout" }

  /radios/{radioId}/cw:
    parameters:
      - $ref: "#/components/parameters/RadioId"
    get:
      tags: [cw]
      operationId: getCW
      summary: CW queue status
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CWStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

    post:
      tags: [cw]
      operationId: sendCW
      summary: Enqueue CW text
      description: |
        Text is in remoses canonical form, which is rig-neutral: a prosign is
        `^` followed by the letters to be keyed with no inter-character spacing,
        such as `^AR` or `^SK`. remoses translates that into whatever the target
        rig speaks — Icom's `^` marker, Kenwood's single-symbol substitutions, or
        a local element table.

        Returns as soon as the text is queued; it does not wait for it to be
        sent. Characters the radio cannot key are rejected with 422 rather than
        silently mangled by the rig.
      parameters:
        - $ref: "#/components/parameters/LockToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CWRequest" }
      responses:
        "202":
          description: Queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CWAccepted" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/LockConflict" }
        "422":
          description: |
            Unsendable character, or CW not supported by this radio. The problem
            document names the offending character, its offset, and the accepted
            charset.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "423": { $ref: "#/components/responses/Locked" }
        "503": { $ref: "#/components/responses/Disconnected" }

    delete:
      tags: [cw]
      operationId: abortCW
      summary: Abort sending
      description: |
        Drops the local queue and tells the rig to stop. Both halves matter: up
        to a full buffer may already be inside the radio.
      parameters:
        - $ref: "#/components/parameters/LockToken"
      responses:
        "204": { description: Aborted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/LockConflict" }
        "423": { $ref: "#/components/responses/Locked" }

  /radios/{radioId}/lock:
    parameters:
      - $ref: "#/components/parameters/RadioId"
    get:
      tags: [lock]
      operationId: getLock
      summary: Who holds the lock
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LockState" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

    post:
      tags: [lock]
      operationId: acquireLock
      summary: Acquire exclusive control
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LockRequest" }
      responses:
        "201":
          description: Acquired
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lock" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Steal requested but disabled by configuration
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/LockConflict" }

    delete:
      tags: [lock]
      operationId: releaseLock
      summary: Release
      description: |
        Releasing while transmitting drops PTT and flushes the CW queue.
      parameters:
        - $ref: "#/components/parameters/LockToken"
      responses:
        "204": { description: Released }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "423": { $ref: "#/components/responses/Locked" }

  /radios/{radioId}/lock/renew:
    parameters:
      - $ref: "#/components/parameters/RadioId"
    post:
      tags: [lock]
      operationId: renewLock
      summary: Heartbeat the lease
      description: |
        Any accepted command renews the lease already. This exists for a client
        holding the radio while its operator thinks, without issuing commands.
      parameters:
        - $ref: "#/components/parameters/LockToken"
      responses:
        "200":
          description: Renewed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lock" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/LockConflict" }
        "423": { $ref: "#/components/responses/Locked" }

  /ws-ticket:
    post:
      tags: [stream]
      operationId: createWSTicket
      summary: Single-use ticket for browser WebSocket clients
      description: |
        Browsers cannot set headers on a WebSocket handshake, so Basic auth is
        unavailable to them. Programmatic clients should send the normal
        `Authorization` header on the upgrade and skip this entirely.
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WSTicket" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /ws:
    get:
      tags: [stream]
      operationId: stream
      summary: WebSocket state stream (all radios)
      description: |
        One connection carries state changes for every radio. Many concurrent
        clients are supported. The stream is read-only and needs no lock; all
        control stays on REST, so the socket has no authorisation surface.

        Every frame is a `WSMessage` and every client message a
        `WSClientMessage`; both are discriminated by `type`. OpenAPI cannot
        attach them to this operation — a 101 has no body — so they are declared
        under `components/schemas`, which is where a generator will find them.

        On connect the server sends `hello`, then one `state` snapshot per
        radio, then `delta` messages as things change.

        Backpressure: state is last-value-wins and is coalesced for a slow
        client, then rate-limited per radio, so `seq` skips values. Discrete
        `cw` and `conn` events are not coalesced; if that queue overflows the
        server emits `resync` and the client should refetch state.

        There is no lock frame. Lock changes have no event feed inside remoses,
        and inventing one from a timer would report a 30 second lease either too
        slowly to be useful or too often to be free; clients read lock state
        from `GET /radios` and `GET /radios/{radioId}/lock`.
      parameters:
        - name: radios
          in: query
          required: false
          description: Comma-separated radio ids to subscribe to. Default all.
          schema: { type: string }
        - name: ticket
          in: query
          required: false
          description: Ticket from /ws-ticket, for browser clients.
          schema: { type: string }
      responses:
        "101": { description: Switching protocols }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /healthz:
    get:
      tags: [radios]
      operationId: health
      summary: Liveness
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [status, radios_connected, radios_total]
                properties:
                  status: { type: string, example: ok }
                  radios_connected: { type: integer }
                  radios_total: { type: integer }

components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic

  parameters:
    RadioId:
      name: radioId
      in: path
      required: true
      description: Stable radio identifier from the configuration file.
      schema: { type: string, example: ic7610 }

    LockToken:
      name: X-Remoses-Lock
      in: header
      required: false
      description: |
        Lock token from POST /radios/{radioId}/lock. Required for every
        state-changing request when locking is enabled. A `remoses_lock_{id}`
        cookie is accepted as a fallback for browsers; the header wins.
      schema: { type: string }

  responses:
    Unauthorized:
      description: Missing or invalid credentials
      headers:
        WWW-Authenticate:
          schema: { type: string }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: No such radio
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    LockConflict:
      description: The lock is held by another user
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Locked:
      description: No lock held, or the token is expired or invalid
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unprocessable:
      description: Out of band, or unsupported by this radio
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Disconnected:
      description: |
        The radio is not usable at the moment: either it is not connected, or it
        answered "busy" and did not take the command. Both are transient and the
        request can be retried; the problem document's detail says which it was.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    RigTimeout:
      description: The rig did not answer within the timeout
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    Problem:
      description: RFC 9457 problem detail, with a radio_id extension member.
      type: object
      required: [title, status]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        radio_id: { type: string }
        locked_by: { type: string }
        expires_at: { type: string, format: date-time }
        character: { type: string }
        offset: { type: integer }
        charset: { type: string }

    Mode:
      type: string
      description: |
        UNKNOWN is reported for a radio that has not connected yet, or whose rig
        answered with a value it documents as a setting failure (Kenwood MD0/MD8).
        It is never accepted as input.

        Not every radio has every mode: DV and DD are D-STAR modes on Icom's
        VHF/UHF and microwave sets, ATV is IC-905 only, and PSK is absent from
        those same radios. C4FM is Yaesu's, and comes in three spellings because
        the radios do: an FT-991A's mode table says only `C4FM`, while an FTX-1
        selects `C4FM-DN` and `C4FM-VW` separately. A radio's `caps.modes` lists
        what it will actually accept, and a mode outside that list is rejected
        with 422.

        `WFM` and `DIG` belong to the FT-857/FT-897 generation. `DIG` is one
        mode for the same reason `C4FM` is: which digital mode it actually is —
        RTTY, PSK31 or a USER slot, and on which sideband — is a menu item no
        CAT command reads.

        `WFM` is the one value that can appear in `state.mode` and never in
        `caps.modes`: those radios report wide FM in their status answer and
        have no command to select it, so it is readable and not settable. A
        client should render a mode it reads rather than assume it came from the
        capability list.
      enum:
        [UNKNOWN, LSB, USB, CW, CW-R, AM, FM, FSK, FSK-R, PSK, PSK-R, DV, DD, ATV,
         C4FM, C4FM-DN, C4FM-VW, WFM, DIG]

    VFO:
      type: string
      description: |
        `current` is the VFO the radio is operating and works everywhere.
        `A`/`B` (and their `main`/`sub` aliases) may be used only where
        `caps.vfos` lists them: naming one needs a protocol command that
        addresses a VFO by name, and on a radio without it remoses would have
        to act on the operating VFO and call it A, which it refuses to do.
      enum: [current, A, B, main, sub]

    # The enumerations below are named rather than spelled out at each use.
    #
    # A generated client is the reason. An enum written inline in `State` and
    # again in `StatePatch` becomes two unrelated types in the generated code —
    # a client could not pass the value it just read back to the field it came
    # from without a cast — and the two spellings drift the moment somebody
    # edits one of them. Naming them once also puts the prose about what the
    # radios disagree over in one place.
    #
    # Where a set can be read but only part of it can be written there are two
    # schemas rather than one, on the pattern Power and PowerSet already set:
    # the reading is the wider set, and what a client may ask for is its own
    # type, so a value that is a reading only cannot be sent back by accident.

    AGC:
      type: string
      description: |
        The AGC speed, as read from the radio. `caps.agc_settings` lists what
        this radio accepts, and the set really does differ between models of one
        make: a TS-590 has slow and fast and no middle, a TS-890 has all three,
        and Icom's command has no off at all.

        The three `auto-*` values are READINGS ONLY, and only Yaesu reports
        them. That radio accepts `auto` and answers with the speed auto chose,
        so a client that sets `auto` and reads `auto-mid` has not failed to set
        anything — which is why they are absent from `AGCSet`.
      enum: [off, fast, mid, slow, auto, auto-fast, auto-mid, auto-slow]

    AGCSet:
      type: string
      description: |
        An AGC speed a client may ask for. The `auto-*` readings are excluded:
        they say what auto CHOSE, and there is no way to tell a radio "be
        automatic, and also be mid". Ask for `auto` instead.
      enum: [off, fast, mid, slow, auto]

    Tuner:
      type: string
      description: |
        The internal antenna tuner: bypassed, in line, or running a tuning
        cycle. `tuning` means the radio is keying its own transmitter right now
        to find a match, so a client should show it the way it shows PTT.
      enum: [off, on, tuning]

    TunerSet:
      type: string
      description: |
        A tuner position a client may ask for. `tuning` is a state to observe,
        not one to ask for — start a cycle with `tuner_tune` — so a client that
        reads the state and writes it back can never key a transmitter.
      enum: [off, on]

    NotchWidth:
      type: string
      description: |
        How wide the manual notch bites. Icom only; `caps.notch_widths` is empty
        elsewhere, because a Kenwood accepts a width and then always answers 0
        for it, and remoses does not offer one it could write and never read
        back.
      enum: [wide, mid, narrow]

    BreakIn:
      type: string
      description: |
        CW break-in, which decides whether CW sent over CAT reaches the air at
        all: with it off and the transmitter not already keyed, the rig accepts
        a message and transmits nothing.

        `on` is break-in enabled on a radio that does not say which kind. Not
        every rig distinguishes them over CAT — an IC-910H's command is "0=OFF,
        1=ON" where the rest of its family has three values — and reporting that
        as `semi` or `full` would invent a distinction the radio declined to
        make. It is an audible one: full is QSK and switches the rig between
        transmit and receive inside the gaps between elements.
      enum: [off, semi, full, on]

    Band:
      type: string
      description: |
        One of a two-receiver radio's two receivers. "Band" rather than
        "receiver" because that is what the radios call them — Icom's MAIN and
        SUB bands — and an operator reading a client will recognise the word off
        the front panel.
      enum: [main, sub]

    PowerSwitch:
      type: string
      description: |
        Switch the radio itself off or on.

        `off` is the recoverable off: on a radio with a choice it is the one
        that draws more standby current and wakes on a single command.
        `off_deep` asks for the lowest standby current the radio offers — on a
        Kenwood, the same as its front-panel switch — which needs the longer
        wake sequence afterwards. A radio with only one off sends it either way.
      enum: [on, off, off_deep]

    VFOAddressing:
      type: string
      description: |
        What `state.vfo_a` and `state.vfo_b` name. `named` means stable labels
        for two fixed slots (an IC-7610's main and sub bands). `relative` means
        A is whichever VFO the operator has selected and B is the other — an
        IC-9700, whose protocol offers exactly that selector and never reports
        which letter is selected. Either way, B is where split sends the
        transmit.
      enum: [named, relative]

    CWMethod:
      type: string
      description: |
        How a radio keys Morse: not at all, from a buffer inside the rig filled
        over CAT, or locally generated and keyed on a serial control line.
      enum: [none, cat, serial_key]

    Backend:
      type: string
      description: |
        The protocol family remoses speaks to this radio.

        `yaesu` covers both of Yaesu's CAT systems: the ASCII dialect the modern
        radios speak and the five-byte binary one of the FT-857/FT-897
        generation. The model chooses, so there is one backend name.
      enum: [civ, kenwood, yaesu, rigctld]

    VFOState:
      description: |
        One VFO's own settings. On a radio with `caps.per_vfo_mode` these are
        genuinely independent — an IC-7610 holds a separate mode, data-mode
        flag and IF filter per VFO — and elsewhere only `frequency` is
        meaningful.
      type: object
      required: [frequency, mode, data_mode, passband_hz, filter_slot]
      properties:
        frequency: { type: integer, format: int64 }
        mode: { $ref: "#/components/schemas/Mode" }
        data_mode: { type: boolean }
        passband_hz: { type: integer }
        filter_slot: { type: integer }

    Power:
      description: |
        Transmit power in every form the backend can supply. The target rigs
        disagree about units and normalising that away would lose information:
        Kenwood PC is watts, Icom 14 0A is a relative index.
      type: object
      # watts is nullable rather than required, though the daemon sends it on
      # every reading. A nullable field already carries its own absence — a
      # client has to ask whether it has a value either way — while marking one
      # required drops `omitempty` from the generated Go, and an unset value on
      # a field without omitempty marshals as a plain 0. That turns "this rig
      # has no watt-accurate scale" into "this rig is putting out 0 watts" for
      # anything that round-trips a state through JSON.
      required: [pct, native]
      properties:
        watts:
          type: number
          format: double
          nullable: true
          description: Absolute watts, null when the rig has no watt-accurate scale.
        pct:
          type: number
          format: double
          description: Normalised 0..100 against the rig's maximum for the current mode.
        native:
          type: integer
          description: The value as it appears on the wire.

    PowerSet:
      description: Exactly one of watts or pct.
      type: object
      properties:
        watts: { type: number, format: double }
        pct: { type: number, format: double, minimum: 0, maximum: 100 }

    Meter:
      description: |
        An uncalibrated meter reading. Neither target rig reports dBm: Kenwood
        SM returns 0..30 meter dots, Icom 15 02 returns 0..255. `s` is present
        only where a per-model calibration table exists.
      type: object
      required: [raw, scale]
      properties:
        raw: { type: integer }
        scale: { type: integer }
        s: { type: number, format: double, nullable: true }

    CWStatus:
      type: object
      required: [busy, queued, wpm, est_remaining_ms]
      properties:
        busy: { type: boolean }
        queued: { type: integer, description: Characters not yet keyed }
        wpm: { type: integer }
        est_remaining_ms: { type: integer }

    # State is defined in three pieces, and the split is for the WebSocket
    # stream: a delta names the fields that changed and nothing else, so it
    # cannot reuse a schema that requires six of them. StateFields is the
    # vocabulary — every field a radio state can carry, none of them required —
    # and the two schemas below say which parts of it a given message promises.
    #
    # A client should never need to name StateFields itself.
    StateFields:
      type: object
      properties:
        frequency: { type: integer, format: int64, description: Hz }
        mode: { $ref: "#/components/schemas/Mode" }
        data_mode:
          type: boolean
          description: |
            Orthogonal to mode. Kenwood models it separately (MD + DA), so
            remoses does too rather than inventing DATA-U style pseudo-modes.
        passband_hz: { type: integer }
        filter_slot: { type: integer }
        power: { $ref: "#/components/schemas/Power" }
        ptt: { type: boolean }
        s_meter: { $ref: "#/components/schemas/Meter" }
        cw: { $ref: "#/components/schemas/CWStatus" }
        # The transmit meters — power_meter, swr, swr_ratio and alc — are
        # described further down, next to break_in.

        # The fields above describe the OPERATING VFO — the one the radio is
        # receiving on, and transmitting on unless split is set. They mean the
        # same on every radio, so a client that does not care about a second VFO
        # can stop reading here.
        vfo:
          allOf: [{ $ref: "#/components/schemas/VFO" }]
          description: |
            Which VFO the fields above describe. Not always switchable: on a
            classic single-receiver radio it follows the operator's A/B switch,
            while an IC-7610 has no such switch — its VFO A is always what it
            receives and transmits on, so this reads `A` permanently there and
            remoses offers no VFO-select operation for it.
        vfo_a: { $ref: "#/components/schemas/VFOState" }
        vfo_b: { $ref: "#/components/schemas/VFOState" }
        split:
          type: boolean
          description: |
            Transmit happens on the *other* VFO. The one flag here that changes
            where RF comes out, so a client showing a transmit frequency should
            read it rather than assuming the operating VFO.
        dual_watch:
          type: boolean
          description: Receiving on both VFOs at once.
        sub_s_meter:
          allOf: [{ $ref: "#/components/schemas/Meter" }]
          description: |
            The second receiver's signal level. Meaningful only while
            `dual_watch` is true: with it off that receiver is not running and
            remoses stops polling it rather than leaving a stale reading that
            would look live.
        selected_band:
          allOf: [{ $ref: "#/components/schemas/Band" }]
          description: |
            Which of a two-receiver radio's receivers the operator has selected,
            and therefore **which receiver the operating fields describe**.

            It matters on an IC-9700. There `frequency` and `mode` follow the
            selection, while `vfo_a` and `vfo_b` are the *main* receiver's pair
            whichever is selected, because that radio's per-VFO commands are
            documented "(Only MAIN band)". So with `"sub"` here, the two halves
            of this object describe two different receivers, and nothing else
            says so. Touching the sub frequency field on the radio's own screen
            is enough to get there.

            The sub receiver has its own VFO A and B, usable at the radio;
            remoses cannot reach them, which is what `caps.sub_receiver_readable`
            reports. `exchange_bands` swaps the two receivers along with their
            VFO pairs, and leaves the selection where it was.

            Absent on a radio with one receiver, or with two that cannot be
            asked which is selected. remoses never *sets* it.

        power_meter:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/Meter" }]
          description: |
            Forward power out of the transmitter.

            **Absent in receive**, rather than zero: a transmitter that is not
            keyed has no forward power, and a client drawing 0 on a bar cannot
            tell "not transmitting" from "transmitting into a dead load". The
            same goes for `swr` and `alc`. All three appear when the radio
            reports itself keyed and vanish when it stops.

            `raw` and `scale` are in whatever units the radio's own meter uses —
            Icom counts 0-255, Kenwood counts meter dots — so compare the two
            rather than assuming either. Check `caps.power_meter` before
            offering the display at all.
        swr:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/Meter" }]
          description: |
            SWR as a meter deflection. Absent in receive; see `power_meter`.

            On an FT-857 or FT-897 this is one bit rather than a deflection —
            `scale` is 1 and `raw` is 0 or 1 — because a high-SWR alarm is all
            those radios report. The scale says so; do not assume a range.
        swr_ratio:
          type: number
          format: double
          nullable: true
          description: |
            SWR as a number, where the radio's own documentation calibrates its
            meter well enough to say: 1.5, 2.0, 3.0.

            Absent on most radios, and absent rather than computed, because a
            deflection means nothing without the manufacturer's own scale and a
            ratio guessed from a linear fit would be a number remoses invented
            about somebody's antenna. Icom publishes four calibration points and
            gets a figure; Kenwood and Yaesu publish none and get only the bar.
            A rigctld rig reports a true ratio directly.

            Also absent above the top calibration point, where the curve is
            undocumented — the bar pins and this stops rather than extrapolating.
        alc:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/Meter" }]
          description: |
            ALC action. Absent in receive; see `power_meter`.

            Note that full scale is not always the data field's range: an Icom's
            ALC runs to 120 of a possible 255, and `scale` carries that.
        standby:
          type: boolean
          description: |
            The radio is reachable but switched off.

            A third state, and neither of the other two describes it. It is
            published with `connected: true`, because the link is fine — an
            IC-7610 in standby keeps its CI-V circuit alive and answers every
            command with a rejection. But nothing else here is live: the values
            are whatever was last true before it was switched off.

            Show it as its own condition and offer a power-on rather than a
            reconnect. Commands answer 503 with the remedy in the message.

            It is set however the radio came to be off — a `power_switch`
            request, or somebody pressing the front-panel button.
        tuner:
          allOf: [{ $ref: "#/components/schemas/Tuner" }]
          description: |
            The internal antenna tuner. Absent on a radio that has none or that
            remoses cannot ask.

            On a TS-590S the state also reports whether a finished cycle
            succeeded, which no command does: a cycle that finds a match ends on
            `on`, one that fails ends on `off`. That is observed behaviour
            rather than something its reference promises, and it has not been
            checked on other families.
        preamp:
          type: integer
          description: |
            The receive preamplifier: 0 for off, 1 to `caps.preamp_levels` for
            the amplifiers in the order the radio numbers them. On a set with
            two, 1 is the quieter and 2 the higher gain. Yaesu calls off "IPO".

            Absent on a radio with no preamplifier command — which is not the
            same as one with no preamplifier. An IC-910H's are external units
            with their own controllers and nothing on the bus to switch them.
        attenuator_db:
          type: integer
          description: |
            The attenuation in line, in dB, 0 for switched out.

            A dB figure rather than a step index, because the steps are not the
            same set twice: an IC-7610 has 3 dB steps to 45, an IC-7600 has 6,
            12 and 18, and most radios have a single fixed pad.
            `caps.attenuator_db` lists what this one accepts.

            Where a radio's CAT reference documents only on and off, the dB
            figure is that radio's published receiver specification rather than
            something the command table states — it is a label on one switch,
            not a value remoses can set independently.
        rf_gain:
          type: number
          format: double
          description: |
            The receiver's RF gain, 0-100%.

            A percentage rather than the radio's own count, because the counts
            differ: a TS-480 reads 0-100 for the same knob a TS-590 reads
            0-255, and a number that means a different thing on two radios of
            one make is a number a client cannot draw.
        agc:
          allOf: [{ $ref: "#/components/schemas/AGC" }]
          description: |
            The AGC speed. Sending an `auto-*` reading back is refused with 422;
            see `AGCSet`.
        ip_plus:
          type: boolean
          description: |
            Icom's IP+ : an intermodulation-rejection mode that trades a little
            sensitivity for a better third-order intercept by backing the
            direct-sampling ADC off its clipping point. Absent where the radio
            has none.
        digi_sel:
          type: boolean
          description: |
            Icom's DIGI-SEL, a narrow tracking preselector ahead of the ADC.

            Worth knowing on an IC-7610: with this engaged the radio REFUSES to
            switch a preamplifier in, and says so only as a bare rejection.
            remoses adds the explanation to the 422 rather than switching the
            preselector off on the operator's behalf.
        digi_sel_shift:
          type: number
          format: double
          description: |
            Where the DIGI-SEL preselector sits, 0-100%. Reported even while the
            preselector is switched out: the radio remembers it, and a client
            redrawing the control wants the position it will return to.
        noise_blanker:
          type: integer
          description: |
            The noise blanker: 0 for off, 1..`caps.noise_blanker_levels` to
            select one.

            A count rather than a switch because a Kenwood has two, NB1 and NB2,
            and they are different circuits rather than two strengths of one.
            That radio can also run both at once and answers 3 for it — a
            combination rather than a third blanker, so it is not published.
        nb_level:
          type: number
          format: double
          description: |
            The blanker's threshold, 0-100%. On Kenwood this is refused while
            the blanker is off, so it is absent until one is running.
        noise_reduction:
          type: integer
          description: |
            The noise reducer: 0 for off, 1..`caps.noise_reduction_levels`.
            Kenwood has two, and NR2 is not "more NR1" — it is a different
            algorithm whose level means something else entirely.
        nr_level:
          type: number
          format: double
          description: |
            The reducer's level, 0-100%.

            What the percentage is a percentage OF depends on the radio and, on
            Kenwood, on which reducer is running: NR1's range is an effective
            level 01-10 and NR2's is a following speed of 2 ms to 20 ms. Absent
            while the reducer is off, which Kenwood refuses the read for.
        notch:
          type: boolean
          description: |
            The manual notch — the one an operator parks on a carrier.

            On most radios this cannot be on at the same time as `auto_notch`;
            see `caps.notch_exclusive`. Where that is true, the radios enforce
            it themselves and not always politely: an Icom switches the other
            notch off silently, so remoses refuses a request for both rather
            than letting one vanish.
        notch_freq:
          type: number
          format: double
          description: |
            Where the manual notch sits, 0-100% of the radio's own range.

            A percentage because the underlying counts have nothing in common:
            0-255 on Icom, 0-127 on Kenwood, and an actual 10 Hz to 3200 Hz on
            Yaesu.
        notch_width:
          $ref: "#/components/schemas/NotchWidth"
        auto_notch:
          type: boolean
          description: |
            The automatic notch, which hunts for tones by itself.

            Not useful in CW, and the radios know it: a TS-590S IGNORES a
            request for it in CW — no error, no change — because notching a tone
            is exactly what would remove the signal being listened to. remoses
            checks the read-back and returns 422 rather than reporting a success
            that did not happen.
        antenna:
          type: integer
          description: |
            Which antenna socket is selected, counting from 1.

            Absent on a radio with no selector remoses can work. Where it is
            present the two antenna fields may not be independent: on Icom the
            socket and `rx_antenna` share one frame, the flag belonging to the
            selected socket, so changing the socket can change `rx_antenna`
            with it.

            The big Icoms also keep a separate per-band antenna MEMORY in their
            Set menu. That is stored configuration rather than a switch, and
            remoses does not write it.
        rx_antenna:
          type: boolean
          description: |
            The separate receive-only input, where the radio has one and can
            report it. Kenwood's `AN` carries it; no Yaesu or Icom read for this
            backend does.
        tx_audio_gain:
          type: number
          format: double
          description: |
            Transmit audio gain, 0-100%.

            A percentage for the same reason `rf_gain` is one: the counts
            underneath are 0-255 on Icom and 0-100 on Kenwood, and a number
            that means a different thing on two radios is a number a client
            cannot draw.

            It is the gain the radio's own gain command reads and writes, NOT
            specifically the microphone socket.

            The caveat is sharper than "remoses does not know which connector
            this belongs to". On several radios the gain is not one setting
            applied to a routed input at all — the rig holds SEVERAL AT ONCE
            and the reference does not say which one the command reaches. An
            FT-710 has MIC GAIN alongside per-mode USB MOD GAIN and REAR MOD
            GAIN; an FT-891 has eight per-mode gains. So on an FT-710 running a
            USB digital mode this may be moving a control that is not in
            circuit.

            Label it "transmit gain", offer it as the control the radio offers,
            and promise nothing about which audio path it lands on.
        proc:
          type: boolean
          description: |
            The speech processor — the transmit audio compressor.

            Off is a setting an operator chooses, not an absence, so this is
            absent only when remoses has no reading at all.
        proc_level:
          type: number
          format: double
          description: |
            The processor's level, 0-100%.

            Reported whether or not `proc` is on, where the radio will answer:
            the setting is remembered, and a client redrawing the control wants
            the value it will return to. Radios that refuse the read while the
            processor is off leave this absent instead.
        break_in:
          allOf: [{ $ref: "#/components/schemas/BreakIn" }]
          description: |
            CW break-in. Absent on a radio remoses cannot ask.

            `POST /cw` will not let a message go silently unsent — depending on
            the server's `cw.break_in` policy it either switches break-in on
            first or refuses with 422. A client offering a CW box should show
            this beside it, and may see it change by itself after a send for
            that reason.

        connected: { type: boolean }
        seq:
          type: integer
          format: int64
          description: |
            The state cache's version for this radio, monotonic per radio and
            never reused. The WebSocket stream carries it on every frame, which
            is what lets a client tell a message that describes state it already
            has from one that describes something newer.

            Values are SKIPPED rather than delivered in sequence: state is
            last-value-wins and the stream coalesces, so a client that sees 8
            after 5 has not lost anything it needed. Discrete `cw` and `conn`
            events are the ones that cannot be missed, and `resync` is how the
            server admits it dropped one.
        updated_at: { type: string, format: date-time }
        age_ms:
          type: integer
          description: |
            How old the snapshot was when the server answered. Present on a REST
            read; absent in the stream, where a snapshot is published as it is
            taken and there is nothing yet to be old.
        stale:
          type: boolean
          description: |
            The poller has not refreshed within the expected interval, which is
            the client's cue to distrust the numbers rather than to guess from
            `age_ms` what "too old" means for this radio. REST reads only, for
            the same reason as `age_ms`.

    State:
      description: |
        A radio's state as remoses last read it.

        The required fields are the ones the daemon publishes for every radio,
        connected or not: they come from the state cache, which always has a
        value for them even if that value is what was true before the port went
        away. Everything else is present only where the radio has the control
        and remoses can read it — see the individual fields, and check `caps`
        before drawing a control whose absence you would otherwise have to
        guess the meaning of.
      allOf:
        - $ref: "#/components/schemas/StateFields"
        - type: object
          required:
            [frequency, mode, data_mode, passband_hz, filter_slot, power, ptt,
             s_meter, cw, vfo, vfo_a, vfo_b, split, dual_watch, sub_s_meter,
             connected, seq, updated_at]

    StateDelta:
      description: |
        The fields that changed, and only those. Carried by a `delta` frame on
        the WebSocket; the names and types are `State`'s, so a client applies
        one by overwriting the fields it names and leaving the rest alone.

        A field present and NULL means the reading has gone away, which is not
        the same as its being absent from the object. The transmit meters —
        `power_meter`, `swr`, `alc`, `swr_ratio` — are the fields this happens
        to: they exist only while the radio is keyed, and clearing them
        explicitly is what stops the last transmission's SWR sitting on a
        display for ever. Applying a delta by merging its keys therefore gets
        the right answer without knowing that rule.

        Those four are declared `nullable`, and that is load-bearing rather than
        decorative: it is what makes the distinction survive into a generated
        client. Without it the usual mapping is an optional pointer, where null
        and absent are both a nil — so a client generated from this document
        could not implement what this paragraph specifies, and would fail in
        exactly the way the paragraph exists to prevent.

        Fifty fields per radio at a two-a-second poll is real bandwidth over a
        link that may be somebody's phone, which is why the stream sends these
        rather than whole snapshots. A client that wants snapshots can ignore
        deltas and refetch, but it will be paying for the choice.
      allOf:
        - $ref: "#/components/schemas/StateFields"

    StatePatch:
      description: |
        Every field is optional. Applied in rig-safe order: mode before
        frequency, then split and dual watch, then PTT last — so a request that
        sets up the other VFO and enables split cannot key before the transmit
        frequency is where it was asked to be. Supplying both power_w and
        power_pct is a 422.

        `vfo` selects what `frequency`, `mode`, `data_mode` and `filter_slot`
        address. Omit it to act on whichever VFO the radio is operating, which
        is the only thing most radios can do; name `A` or `B` only where
        `caps.vfos` lists them. On a radio with `caps.per_vfo_mode` a naming
        request sets mode, data mode and filter in a single command, so those
        cannot disturb one another.
      type: object
      properties:
        frequency: { type: integer, format: int64 }
        mode: { $ref: "#/components/schemas/Mode" }
        data_mode: { type: boolean }
        vfo: { $ref: "#/components/schemas/VFO" }
        passband_hz: { type: integer }
        filter_slot: { type: integer }
        power_w: { type: number, format: double }
        power_pct: { type: number, format: double, minimum: 0, maximum: 100 }
        ptt: { type: boolean }
        split:
          type: boolean
          description: Needs `caps.split`; 422 otherwise.
        dual_watch:
          type: boolean
          description: Needs `caps.dual_watch`; 422 otherwise.
        break_in:
          allOf: [{ $ref: "#/components/schemas/BreakIn" }]
          description: |
            CW break-in. Needs `caps.break_in_control`; 422 otherwise. Applied
            before PTT, so a request that enables break-in and then sends does
            the two in the order that makes the first message audible.

            On a radio that only distinguishes off from on, `semi` and `full`
            both set its single "on" and the state reads back `on` — see
            `State.break_in`. `on` on a radio that does distinguish them selects
            `semi`, the quieter of the two.
        power_switch:
          allOf: [{ $ref: "#/components/schemas/PowerSwitch" }]
          description: |
            Switch the radio itself off or on. Needs `caps.power_switch`; 422
            otherwise. **Must be the only field in the request** — a patch that
            switched the radio off and set a frequency has no sensible ordering,
            since one of the two is always addressed to a radio that is not
            listening.

            **Prefer `off` unless somebody can reach the radio**: a remote
            station that cannot be woken is one that needs a visit.

            `on` is a single method whatever the radio needs: the backend tries
            the cheap wake first and escalates to its family's documented ritual
            — a dummy byte, a wait, a retry inside a timing window — only if
            that draws nothing.

            Switching off answers with the state as it was; there is nothing
            left to read back, and `connected` will go false shortly afterwards.
            That is the command working, not failing.

            Switching on works while `connected` is false, which is the state it
            is for. If there is no link, remoses arms the wake and sends it on
            its next connection attempt, on the freshly opened port before it
            tries to talk to the radio — the one moment a sleeping rig can be
            reached. Expect the radio to take several seconds to boot; watch
            `connected`.

            Whether a radio can be woken at all depends on wiring rather than on
            the command. An external CI-V interface stays powered and listening;
            a radio whose CAT arrives over its own USB may take the USB device
            down with it and leave nothing to send the wake-up to.
        preamp:
          type: integer
          description: |
            Select a preamplifier: 0 for off, up to `caps.preamp_levels`. 422
            where the radio has no preamplifier command or the level is past
            what it offers.
        attenuator_db:
          type: integer
          description: |
            Set the attenuator, in dB, 0 for switched out. Must be 0 or one of
            `caps.attenuator_db`; 422 otherwise, with the accepted list in the
            message.
        rf_gain:
          type: number
          format: double
          description: |
            Set the receiver RF gain, 0-100%. Needs `caps.rf_gain_control`.
        agc:
          allOf: [{ $ref: "#/components/schemas/AGCSet" }]
          description: |
            Set the AGC speed. Must be one of `caps.agc_settings`.

            Kenwood radios refuse this in FM — their references say so, and the
            error tone sounds at the radio — so a request there returns 422 with
            the rig's own refusal.
        ip_plus:
          type: boolean
          description: |
            Switch Icom's IP+ mode. Needs `caps.ip_plus_control`.
        digi_sel:
          type: boolean
          description: |
            Switch Icom's DIGI-SEL preselector in or out of line. Needs
            `caps.digi_sel_control`.
        digi_sel_shift:
          type: number
          format: double
          description: |
            Move the DIGI-SEL preselector, 0-100%. Needs
            `caps.digi_sel_shift_control`. Accepted while the preselector is
            switched out; the radio keeps the setting.
        noise_blanker:
          type: integer
          description: |
            Select a noise blanker: 0 for off, up to
            `caps.noise_blanker_levels`.
        nb_level:
          type: number
          format: double
          description: |
            Set the blanker threshold, 0-100%. Applied AFTER `noise_blanker` in
            the same request, because Kenwood refuses a level while the blanker
            is off — so one request can switch a blanker in and set it.
        noise_reduction:
          type: integer
          description: |
            Select a noise reducer: 0 for off, up to
            `caps.noise_reduction_levels`.
        nr_level:
          type: number
          format: double
          description: |
            Set the reducer's level, 0-100%, against whichever range the
            running reducer uses. Applied after `noise_reduction`.
        notch:
          type: boolean
          description: |
            Switch the manual notch. Needs `caps.notch_control`.

            Where `caps.notch_exclusive` is true, setting this true together
            with `auto_notch` true is refused with 422 — the radio has one notch
            and would silently give you whichever was written last.
        notch_freq:
          type: number
          format: double
          description: |
            Park the manual notch, 0-100% of the radio's range.
        notch_width:
          allOf: [{ $ref: "#/components/schemas/NotchWidth" }]
          description: |
            Set the manual notch width. Must be one of `caps.notch_widths`,
            which is empty outside Icom.
        auto_notch:
          type: boolean
          description: |
            Switch the automatic notch. Needs `caps.auto_notch_control`.

            A TS-590S in CW will decline this without saying so; remoses
            verifies the read-back and answers 422 naming the mode rather than
            reporting a success that did not happen.
        antenna:
          type: integer
          description: |
            Select an antenna socket, 1 to `caps.antennas`. Refused where
            `caps.antennas` is 0, which is most of the small sets in every
            family — see the state field.
        rx_antenna:
          type: boolean
          description: |
            Switch the receive-only input. Needs `caps.rx_antenna_control`.
        tx_audio_gain:
          type: number
          format: double
          description: |
            Set the transmit audio gain, 0-100%. Needs `caps.tx_audio_gain_control`.
        proc:
          type: boolean
          description: |
            Switch the speech processor. Needs `caps.proc_control`.
        proc_level:
          type: number
          format: double
          description: |
            Set the processor's level, 0-100%. Needs `caps.proc_level_control`,
            and applied AFTER `proc` in the same request, because a radio that
            refuses the level while the processor is off would otherwise reject
            a request that switches it on and sets it in one go.
        tuner:
          allOf: [{ $ref: "#/components/schemas/TunerSet" }]
          description: |
            Switch the antenna tuner in or out of line. Needs
            `caps.tuner_control`; 422 otherwise.

            Applied before `ptt` and before `tuner_tune`, so a request that
            switches the tuner in and then tunes does the two in the order that
            works: a Kenwood will not begin a cycle with the tuner bypassed.
        tuner_tune:
          type: boolean
          description: |
            `true` starts a tuning cycle. **This transmits**: the radio keys
            itself for a second or two while it hunts for a match.

            An action rather than a state, and a separate field from `tuner` so
            that a client which reads the state and writes it back can never key
            a transmitter by echoing `"tuning"`. `false` is a 422 — there is
            nothing it could mean.

            Treated as a transmit operation throughout: it needs the lock, it is
            refused outside `limits.bands`, and it arms the transmit dead-man
            timer. It returns as soon as the radio accepts the command, not when
            the cycle ends; watch `state.tuner` for that.
        vfo_mode:
          type: boolean
          description: |
            `true` returns the radio to VFO operation, out of memory mode. An
            action rather than a state: remoses models no memory mode, so there
            is nothing to read back and `false` is a 422. Combine with `vfo` to
            select which VFO, where the radio has such a command. Applied before
            everything else, since a rig on a memory channel refuses much of the
            rest.
        exchange_bands:
          type: boolean
          description: |
            `true` swaps the radio's two receivers, so the band the sub receiver
            was holding becomes the one everything else operates. Needs
            `caps.band_exchange`; 422 otherwise, and `false` is a 422 because
            there is nothing it could swap back.

            This exists for a band an operator otherwise cannot reach at all. An
            IC-9700 refuses to put its main receiver on a band its sub receiver
            is using, and no command addresses the sub — so 2 m left on the sub
            side is simply unreachable from the network until the two exchange.

            **Every field in the response changes at once**, because they all
            describe a different band afterwards: frequency, mode, both filters
            and both VFOs. remoses re-reads the radio in full before answering,
            so the response is the new band rather than the old one, and a
            client holding state should replace it rather than merge.

            Applied before everything else in the same request, so
            `{"exchange_bands": true, "frequency": 144300000}` brings the band
            over and then tunes it — which is the reason an operator reaches for
            this in the first place.

    Caps:
      description: |
        What this radio can do, as far as remoses can work it. Read these rather
        than guessing from the model name — and rather than inferring a
        capability from a state field, since most of those are absent both when
        the radio has no such control and when it is simply switched off.

        Everything the daemon can answer for every radio is required, so a
        client need not treat "the flag is missing" as a third case. The
        optional ones are the lists and figures that only some radios have at
        all: an attenuator's steps, the AGC speeds, a watt figure.
      type: object
      required:
        [modes, vfos, ptt_control, power_control, power_watt_accurate,
         filter_width, filter_slots, s_meter_scale, power_meter, swr_meter,
         alc_meter, power_switch, tuner_control, tuner_tune, preamp_levels,
         rf_gain_control, ip_plus_control, digi_sel_control,
         digi_sel_shift_control, noise_blanker_levels, nb_level_control,
         noise_reduction_levels, nr_level_control, notch_control,
         notch_freq_control, auto_notch_control, notch_exclusive, antennas,
         rx_antenna_control, tx_audio_gain_control, proc_control, proc_level_control,
         sub_receiver, sub_receiver_readable, split,
         dual_watch, band_exchange, per_vfo_mode, break_in_control, cw_method]
      properties:
        modes:
          type: array
          items: { $ref: "#/components/schemas/Mode" }
        vfos:
          type: array
          items: { $ref: "#/components/schemas/VFO" }
        power_watt_accurate:
          type: boolean
          description: True when the rig's power scale is real watts.
        max_power_w: { type: number, format: double }
        filter_width: { type: boolean }
        filter_slots: { type: integer }
        s_meter_scale: { type: integer }
        sub_receiver:
          type: boolean
          description: |
            The radio has a second receiver that can listen at the same time as
            the first. Not merely "two VFOs" — nearly all of them have that.
            Whether remoses can *report* it is `sub_receiver_readable`.
        sub_receiver_readable:
          type: boolean
          description: |
            The second receiver's state can be read, so `state.sub_s_meter` is
            live. False on a radio that has one remoses cannot address: the
            IC-9700's sub band is reachable only by telling the radio to select
            it, which would move the operator's own focus, and remoses does not
            switch bands to fill in a meter.
        vfo_addressing:
          allOf: [{ $ref: "#/components/schemas/VFOAddressing" }]
          description: |
            What `state.vfo_a` and `state.vfo_b` name. Absent on a radio with a
            single addressable VFO.
        split:
          type: boolean
          description: Transmit-on-the-other-VFO can be read and set.
        dual_watch:
          type: boolean
          description: Receiving on both VFOs at once can be switched.
        band_exchange:
          type: boolean
          description: |
            The two receivers' contents can be swapped, with
            `{"exchange_bands": true}`. True on an IC-9700, where it is the only
            route to a band left on the sub receiver: that radio refuses to put
            its main receiver on a band the sub one is using.
        per_vfo_mode:
          type: boolean
          description: |
            Each VFO carries its own mode, data-mode flag and filter rather than
            only its own frequency. Where this is false, treat mode and filter
            as properties of the radio and read only `frequency` from
            `state.vfo_a` / `state.vfo_b`.
        power_meter:
          type: boolean
          description: |
            This radio can report forward power while transmitting. See
            `State.power_meter` for why the reading is absent in receive, and
            why this flag is the thing to check before drawing a meter panel.
        swr_meter:
          type: boolean
          description: |
            This radio can report SWR while transmitting — as a deflection in
            `State.swr`, as a ratio in `State.swr_ratio`, or both. True on an
            FT-857 too, where the "meter" is a single high-SWR bit.
        alc_meter:
          type: boolean
          description: This radio can report ALC action while transmitting.
        power_switch:
          type: boolean
          description: |
            remoses can switch this radio itself off, and on again afterwards.

            Whether the second half works at a given station depends on wiring
            rather than on the command — see `power_switch` in a state patch —
            so treat this as "the radio has the command", not "you will get it
            back".
        preamp_levels:
          type: integer
          description: |
            How many preamplifiers remoses can select on this radio: 0 for none
            on the bus, 1 for a single on/off, 2 for a set with two stages. A
            client offers 0 to this number.
        attenuator_db:
          type: array
          items:
            type: integer
          description: |
            The attenuation steps this radio accepts, in dB and ascending, NOT
            including 0 — switched out is always available where the list is not
            empty. Absent or empty on a radio with no attenuator command, an
            FTdx9000 among them.

            One entry is a single fixed pad, which is most radios; an IC-7610
            lists fifteen.
        rf_gain_control:
          type: boolean
          description: |
            remoses can read and set the receiver's RF gain on this radio.
        agc_settings:
          type: array
          items: { $ref: "#/components/schemas/AGCSet" }
          description: |
            The AGC speeds this radio accepts, empty where remoses cannot work
            its AGC at all. Offer these rather than a fixed three: the set
            differs between models of one make, and Icom's command has no off.
        ip_plus_control:
          type: boolean
          description: |
            remoses can switch Icom's IP+ mode on this radio.
        digi_sel_control:
          type: boolean
          description: |
            remoses can switch Icom's DIGI-SEL preselector on this radio.
        digi_sel_shift_control:
          type: boolean
          description: |
            remoses can move the DIGI-SEL preselector. Separate from
            `digi_sel_control` because the big superhets have the preselector
            and no documented command to move it.
        noise_blanker_levels:
          type: integer
          description: |
            How many noise blankers remoses can select on this radio: 0 for
            none, 1 for a plain on/off, 2 on a Kenwood. A client offers 0..n.
        nb_level_control:
          type: boolean
          description: remoses can read and set the blanker's threshold.
        noise_reduction_levels:
          type: integer
          description: |
            How many noise reducers, on the same rule. Kenwood's NR1 and NR2 are
            different algorithms, not two strengths.
        nr_level_control:
          type: boolean
          description: remoses can read and set the reducer's level.
        notch_control:
          type: boolean
          description: remoses can switch this radio's manual notch.
        notch_freq_control:
          type: boolean
          description: remoses can move the manual notch.
        notch_widths:
          type: array
          items: { $ref: "#/components/schemas/NotchWidth" }
          description: |
            The manual notch widths this radio accepts, empty where it has none
            that remoses can both set and read back.
        auto_notch_control:
          type: boolean
          description: remoses can switch this radio's automatic notch.
        notch_exclusive:
          type: boolean
          description: |
            The manual and automatic notches cannot both be on. True on Kenwood,
            whose `NT` is one selector, and true on Icom — where the two are
            separate commands that nonetheless switch each other off, verified
            on an IC-7610 rather than documented anywhere.

            Where this is true a client should draw the two as one three-way
            choice, and a request setting both true is refused.
        antennas:
          type: integer
          description: |
            How many antenna sockets remoses can select between, 0 where it
            cannot.

            Independent of `rx_antenna_control`: an IC-9100 selects between two
            sockets and has no receive antenna, while an IC-7300MK2 has a
            receive antenna and no socket to choose.
        rx_antenna_control:
          type: boolean
          description: |
            remoses can switch the separate receive-only input.
        tx_audio_gain_control:
          type: boolean
          description: |
            remoses can read and set the transmit audio gain, as a percentage.

            It says nothing about which connector that gain belongs to, nor —
            on radios that hold several gains at once — about which of them the
            command reaches. See the state field.
        proc_control:
          type: boolean
          description: remoses can switch this radio's speech processor.
        proc_level_control:
          type: boolean
          description: |
            remoses can set the processor's level. Separate from
            `proc_control` because a radio may offer the switch and keep the
            level on its panel or in a menu.
        tuner_control:
          type: boolean
          description: |
            remoses can switch this radio's internal antenna tuner in and out of
            line, and read which it is.
        tuner_tune:
          type: boolean
          description: |
            remoses can start a tuning cycle on this radio. A client should
            treat it as a transmit control rather than a settings toggle: it
            keys the transmitter, and it is refused without the lock.
        ptt_control:
          type: boolean
          description: |
            remoses can key and unkey the transmitter on this radio.

            False is not exotic: the IC-706 family has no transmitter command in
            its control set at all, so PTT there is a footswitch, the microphone
            or a control line. Where this is false, `{"ptt": …}` returns 422 and
            `state.ptt` stays false because nothing reports it either — so a
            client should hide the control rather than show one that cannot key
            and a state that never changes.
        power_control:
          type: boolean
          description: |
            remoses can read and set RF output power. False where the radio has
            no power command and output is a front-panel control; `power_w` and
            `power_pct` are then refused with 422.
        break_in_control:
          type: boolean
          description: |
            remoses can read and set CW break-in on this radio. Worth checking
            before offering a CW box: where it is true, `state.break_in` says
            whether Morse sent now would actually be transmitted.

            `POST /cw` acts on that by itself. Under the default server-side
            `cw.break_in` policy it switches break-in on before sending, so a
            client need not; configured `manual` it refuses instead, with 422.
            Either way a message is never accepted and then silently not
            transmitted, which is what a rig with break-in off does on its own.
        cw_method: { $ref: "#/components/schemas/CWMethod" }
        cw_charset:
          type: string
          description: Characters this radio will key. Clients should validate against it.
        cw_min_wpm: { type: integer }
        cw_max_wpm: { type: integer }

    Limits:
      type: object
      properties:
        max_power_w: { type: number, format: double }
        max_power_pct: { type: number, format: double }
        tx_timeout_s: { type: integer }
        bands:
          type: array
          items: { type: string, example: 14.0-14.35MHz }

    Radio:
      type: object
      required: [id, name, backend, connected, caps, limits, lock]
      properties:
        id: { type: string }
        name: { type: string }
        backend: { $ref: "#/components/schemas/Backend" }
        connected: { type: boolean }
        caps: { $ref: "#/components/schemas/Caps" }
        limits: { $ref: "#/components/schemas/Limits" }
        lock: { $ref: "#/components/schemas/LockState" }

    LockRequest:
      type: object
      properties:
        force:
          type: boolean
          description: Steal a held lock. Permitted only when enabled in configuration.

    Lock:
      type: object
      required: [token, expires_at, ttl_seconds]
      properties:
        token: { type: string }
        expires_at: { type: string, format: date-time }
        ttl_seconds: { type: integer }

    LockState:
      type: object
      required: [held, is_mine]
      properties:
        held: { type: boolean }
        holder: { type: string }
        expires_at: { type: string, format: date-time }
        is_mine: { type: boolean }

    CWRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string
          description: |
            Canonical form; `^AR` style prosigns.

            The example callsign is the reserved placeholder `N0CALL` on
            purpose: an example that carries a real one gets copied and
            transmitted, and then identifies the wrong station.
          example: CQ TEST DE N0CALL ^AR
        wpm: { type: integer }
        mode:
          type: string
          enum: [append, replace]
          default: append

    CWAccepted:
      type: object
      required: [queued_chars, position, est_duration_ms]
      properties:
        queued_chars: { type: integer }
        position: { type: integer }
        est_duration_ms: { type: integer }

    WSTicket:
      type: object
      required: [ticket, expires_at]
      properties:
        ticket: { type: string }
        expires_at: { type: string, format: date-time }

    # The WebSocket vocabulary.
    #
    # OpenAPI has nothing to say about a WebSocket, so GET /ws below can only
    # promise a 101. The frames are described here anyway, as ordinary schemas,
    # because a client generated from this document should not have to
    # hand-write the half of the API that carries the traffic — and because a
    # message shape nobody can generate against is a message shape that drifts.
    #
    # WSMessage is a oneOf with a discriminator rather than one struct with
    # every field optional. That is the difference between a generated client
    # offering `AsWSDelta()` on a frame whose type says "delta", and one
    # offering a `state` field that is null on five frames out of six.

    WSMessage:
      description: |
        One frame from the server, discriminated by `type`.

        The set is closed: a client is entitled to ignore a type it does not
        recognise, so adding one is a protocol change rather than a free
        extension point. On connect the server sends `hello`, then one `state`
        per subscribed radio, then deltas and events as they happen.
      oneOf:
        - $ref: "#/components/schemas/WSHello"
        - $ref: "#/components/schemas/WSState"
        - $ref: "#/components/schemas/WSDelta"
        - $ref: "#/components/schemas/WSCW"
        - $ref: "#/components/schemas/WSConn"
        - $ref: "#/components/schemas/WSResync"
      discriminator:
        propertyName: type
        mapping:
          hello: "#/components/schemas/WSHello"
          state: "#/components/schemas/WSState"
          delta: "#/components/schemas/WSDelta"
          cw: "#/components/schemas/WSCW"
          conn: "#/components/schemas/WSConn"
          resync: "#/components/schemas/WSResync"

    WSEvent:
      description: |
        What every frame about a radio carries. `hello` is the one frame that
        does not, because it describes the connection rather than a radio.

        All three are on every such frame, including the discrete `cw` and
        `conn` events, so that a client can place any message in the stream
        without correlating it against something else it received.
      type: object
      required: [radio, seq, ts]
      properties:
        radio:
          type: string
          description: The radio this frame is about.
          example: ic7610
        seq:
          type: integer
          format: int64
          description: |
            The state cache's version this frame describes — the same counter as
            `state.seq`, monotonic per radio.

            Deltas SKIP values, by design: the stream coalesces per radio, so a
            client that sees 41 after 37 has been spared three updates that a
            later one superseded. What a jump does not mean is that a discrete
            event was lost — that is what `resync` says, and nothing else does.

            A `cw` or `conn` frame carries the version its own change produced,
            which is why the same number can appear twice: once as the event,
            once as the state that followed from it.
        ts:
          type: string
          format: date-time
          description: When the server read the change, not when it sent it.

    WSHello:
      description: |
        Sent once, first, on every connection.
      type: object
      required: [type, version, radios, server_time]
      properties:
        type: { type: string, enum: [hello] }
        version:
          type: string
          description: The daemon's build version.
        radios:
          type: array
          items: { type: string }
          description: |
            What THIS connection carries, which is not always what was asked
            for: `?radios=` names that the instance does not have are dropped
            rather than refused, so this is where a client finds out.
          example: [ic7610]
        server_time: { type: string, format: date-time }

    WSState:
      description: |
        A full snapshot: sent once per radio on connect, on a new subscription,
        and whenever a change cannot be expressed as a delta.
      allOf:
        - $ref: "#/components/schemas/WSEvent"
        - type: object
          required: [type, state]
          properties:
            type: { type: string, enum: [state] }
            state: { $ref: "#/components/schemas/State" }

    WSDelta:
      description: |
        The fields that changed since the last frame for this radio. Apply it
        over the snapshot; see `StateDelta` for what a null means.
      allOf:
        - $ref: "#/components/schemas/WSEvent"
        - type: object
          required: [type, changed]
          properties:
            type: { type: string, enum: [delta] }
            changed: { $ref: "#/components/schemas/StateDelta" }

    WSCW:
      description: |
        The Morse queue moved. Discrete and never coalesced: "the queue emptied"
        and "the queue filled again" are different facts rather than two
        versions of one.
      allOf:
        - $ref: "#/components/schemas/WSEvent"
        - type: object
          required: [type, busy, queued, wpm]
          properties:
            type: { type: string, enum: [cw] }
            busy: { type: boolean }
            queued: { type: integer, description: Characters not yet keyed }
            wpm: { type: integer }

    WSConn:
      description: |
        The link to the radio came up or went down. Also discrete.
      allOf:
        - $ref: "#/components/schemas/WSEvent"
        - type: object
          required: [type, connected]
          properties:
            type: { type: string, enum: [conn] }
            connected: { type: boolean }
            error:
              type: string
              description: |
                Why the port went away. Absent on the way up. It is the one
                thing an operator at the other end of the link cannot see for
                themselves, which is why it is carried rather than only logged.

    WSResync:
      description: |
        This client's view of the radio has a hole in it: the server dropped
        discrete events for it rather than wedging or hanging up. Refetch
        `GET /radios/{radioId}/state`.

        `seq` is the last version this connection was actually sent, so the hole
        is after it.
      allOf:
        - $ref: "#/components/schemas/WSEvent"
        - type: object
          required: [type]
          properties:
            type: { type: string, enum: [resync] }

    WSClientMessage:
      description: |
        The whole client-to-server vocabulary, discriminated by `type`.

        It is this small on purpose. All control stays on REST, so there is no
        message a client can send here that reaches a radio — the socket has no
        authorisation surface at all. Anything else is ignored in silence rather
        than answered with an error that would invite a client to look for one.
      oneOf:
        - $ref: "#/components/schemas/WSPing"
        - $ref: "#/components/schemas/WSSubscribe"
      discriminator:
        propertyName: type
        mapping:
          ping: "#/components/schemas/WSPing"
          subscribe: "#/components/schemas/WSSubscribe"

    WSPing:
      description: |
        Liveness, for a client that cannot send a WebSocket control frame. There
        is no pong: the server's own ping is what measures the link, and this
        only proves the client is still there.
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [ping] }

    WSSubscribe:
      description: |
        Replace the subscription. An empty list means every radio, exactly as an
        absent `?radios=` does at connect. Newly subscribed radios get a `state`
        frame before any delta.
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [subscribe] }
        radios:
          type: array
          items: { type: string }
