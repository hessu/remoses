openapi: 3.0.3

info:
  title: remoses
  version: 0.1.0
  description: |
    Remote control of amateur radio transceivers.

    remoses runs next to the radios and exposes frequency, mode, filter, power,
    PTT and CW sending over HTTP, with a WebSocket stream of state changes.

    ## Authentication

    HTTP Basic on every request, over TLS. Authorisation is per instance: any
    authenticated user may use any radio.

    ## Locking

    Exclusive control is per radio. Acquire a lock, then pass its token in the
    `X-Remoses-Lock` header on every state-changing request. The lease slides:
    any accepted command renews it. Reads and the WebSocket need no lock.

    If a lock expires or is released while the radio is transmitting, remoses
    drops PTT and flushes the CW queue. A client that crashes mid-transmission
    must not leave a carrier up.

servers:
  - url: /api/v1

security:
  - basicAuth: []

tags:
  - name: radios
  - name: control
  - name: cw
  - name: lock
  - name: stream

paths:
  /radios:
    get:
      tags: [radios]
      operationId: listRadios
      summary: List configured radios
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Radio" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /radios/{radioId}:
    parameters:
      - $ref: "#/components/parameters/RadioId"
    get:
      tags: [radios]
      operationId: getRadio
      summary: Radio descriptor, capabilities and configured limits
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Radio" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /radios/{radioId}/state:
    parameters:
      - $ref: "#/components/parameters/RadioId"
    get:
      tags: [control]
      operationId: getState
      summary: Cached state snapshot
      description: |
        Served from the session's state cache, so it never blocks on the serial
        port and always succeeds for a configured radio. A disconnected radio is
        reported through `connected: false` rather than an error status — the
        last known state is still useful, and the client needs to distinguish
        "no such radio" from "radio unplugged". `age_ms` says how old the
        snapshot is; `stale` is set when the poller has not refreshed it within
        the expected interval.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/State" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

    patch:
      tags: [control]
      operationId: patchState
      summary: Set one or more state fields atomically
      description: |
        The primary control verb. Fields are applied in a rig-safe order — mode
        before frequency, because mode selection can change the filter and
        carrier offset — so "14.025 CW" is one transaction rather than two
        racing requests.

        After applying the write, remoses reads back from the rig before
        responding, so the response reflects reality rather than intent. Rigs
        silently clamp: per-band power limits, unsupported filter slots.
      parameters:
        - $ref: "#/components/parameters/LockToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StatePatch" }
      responses:
        "200":
          description: Applied, with state as read back from the rig
          content:
            application/json:
              schema: { $ref: "#/components/schemas/State" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/LockConflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "423": { $ref: "#/components/responses/Locked" }
        "503": { $ref: "#/components/responses/Disconnected" }
        "504": { $ref: "#/components/responses/RigTimeout" }

  /radios/{radioId}/cw:
    parameters:
      - $ref: "#/components/parameters/RadioId"
    get:
      tags: [cw]
      operationId: getCW
      summary: CW queue status
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CWStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

    post:
      tags: [cw]
      operationId: sendCW
      summary: Enqueue CW text
      description: |
        Text is in remoses canonical form, which is rig-neutral: a prosign is
        `^` followed by the letters to be keyed with no inter-character spacing,
        such as `^AR` or `^SK`. remoses translates that into whatever the target
        rig speaks — Icom's `^` marker, Kenwood's single-symbol substitutions, or
        a local element table.

        Returns as soon as the text is queued; it does not wait for it to be
        sent. Characters the radio cannot key are rejected with 422 rather than
        silently mangled by the rig.
      parameters:
        - $ref: "#/components/parameters/LockToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CWRequest" }
      responses:
        "202":
          description: Queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CWAccepted" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/LockConflict" }
        "422":
          description: |
            Unsendable character, or CW not supported by this radio. The problem
            document names the offending character, its offset, and the accepted
            charset.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "423": { $ref: "#/components/responses/Locked" }
        "503": { $ref: "#/components/responses/Disconnected" }

    delete:
      tags: [cw]
      operationId: abortCW
      summary: Abort sending
      description: |
        Drops the local queue and tells the rig to stop. Both halves matter: up
        to a full buffer may already be inside the radio.
      parameters:
        - $ref: "#/components/parameters/LockToken"
      responses:
        "204": { description: Aborted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/LockConflict" }
        "423": { $ref: "#/components/responses/Locked" }

  /radios/{radioId}/lock:
    parameters:
      - $ref: "#/components/parameters/RadioId"
    get:
      tags: [lock]
      operationId: getLock
      summary: Who holds the lock
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LockState" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

    post:
      tags: [lock]
      operationId: acquireLock
      summary: Acquire exclusive control
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LockRequest" }
      responses:
        "201":
          description: Acquired
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lock" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Steal requested but disabled by configuration
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/LockConflict" }

    delete:
      tags: [lock]
      operationId: releaseLock
      summary: Release
      description: |
        Releasing while transmitting drops PTT and flushes the CW queue.
      parameters:
        - $ref: "#/components/parameters/LockToken"
      responses:
        "204": { description: Released }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "423": { $ref: "#/components/responses/Locked" }

  /radios/{radioId}/lock/renew:
    parameters:
      - $ref: "#/components/parameters/RadioId"
    post:
      tags: [lock]
      operationId: renewLock
      summary: Heartbeat the lease
      description: |
        Any accepted command renews the lease already. This exists for a client
        holding the radio while its operator thinks, without issuing commands.
      parameters:
        - $ref: "#/components/parameters/LockToken"
      responses:
        "200":
          description: Renewed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lock" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/LockConflict" }
        "423": { $ref: "#/components/responses/Locked" }

  /ws-ticket:
    post:
      tags: [stream]
      operationId: createWSTicket
      summary: Single-use ticket for browser WebSocket clients
      description: |
        Browsers cannot set headers on a WebSocket handshake, so Basic auth is
        unavailable to them. Programmatic clients should send the normal
        `Authorization` header on the upgrade and skip this entirely.
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WSTicket" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /ws:
    get:
      tags: [stream]
      operationId: stream
      summary: WebSocket state stream (all radios)
      description: |
        One connection carries state changes for every radio. Many concurrent
        clients are supported. The stream is read-only and needs no lock; all
        control stays on REST, so the socket has no authorisation surface.

        On connect the server sends `hello`, then one `state` snapshot per
        radio, then `delta` messages. `seq` is monotonic per radio so clients
        can detect gaps.

        Backpressure: state is last-value-wins and is coalesced for a slow
        client, then rate-limited per radio. Discrete `cw`, `lock` and `conn`
        events are not coalesced; if that queue overflows the server emits
        `resync` and the client should refetch state.
      parameters:
        - name: radios
          in: query
          required: false
          description: Comma-separated radio ids to subscribe to. Default all.
          schema: { type: string }
        - name: ticket
          in: query
          required: false
          description: Ticket from /ws-ticket, for browser clients.
          schema: { type: string }
      responses:
        "101": { description: Switching protocols }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /healthz:
    get:
      tags: [radios]
      operationId: health
      summary: Liveness
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, example: ok }
                  radios_connected: { type: integer }
                  radios_total: { type: integer }

components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic

  parameters:
    RadioId:
      name: radioId
      in: path
      required: true
      description: Stable radio identifier from the configuration file.
      schema: { type: string, example: ic7610 }

    LockToken:
      name: X-Remoses-Lock
      in: header
      required: false
      description: |
        Lock token from POST /radios/{radioId}/lock. Required for every
        state-changing request when locking is enabled. A `remoses_lock_{id}`
        cookie is accepted as a fallback for browsers; the header wins.
      schema: { type: string }

  responses:
    Unauthorized:
      description: Missing or invalid credentials
      headers:
        WWW-Authenticate:
          schema: { type: string }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: No such radio
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    LockConflict:
      description: The lock is held by another user
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Locked:
      description: No lock held, or the token is expired or invalid
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unprocessable:
      description: Out of band, or unsupported by this radio
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Disconnected:
      description: |
        The radio is not usable at the moment: either it is not connected, or it
        answered "busy" and did not take the command. Both are transient and the
        request can be retried; the problem document's detail says which it was.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    RigTimeout:
      description: The rig did not answer within the timeout
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    Problem:
      description: RFC 9457 problem detail, with a radio_id extension member.
      type: object
      required: [title, status]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        radio_id: { type: string }
        locked_by: { type: string }
        expires_at: { type: string, format: date-time }
        character: { type: string }
        offset: { type: integer }
        charset: { type: string }

    Mode:
      type: string
      description: |
        UNKNOWN is reported for a radio that has not connected yet, or whose rig
        answered with a value it documents as a setting failure (Kenwood MD0/MD8).
        It is never accepted as input.

        Not every radio has every mode: DV and DD are D-STAR modes on Icom's
        VHF/UHF and microwave sets, ATV is IC-905 only, and PSK is absent from
        those same radios. C4FM is Yaesu's, and comes in three spellings because
        the radios do: an FT-991A's mode table says only `C4FM`, while an FTX-1
        selects `C4FM-DN` and `C4FM-VW` separately. A radio's `caps.modes` lists
        what it will actually accept, and a mode outside that list is rejected
        with 422.

        `WFM` and `DIG` belong to the FT-857/FT-897 generation. `DIG` is one
        mode for the same reason `C4FM` is: which digital mode it actually is —
        RTTY, PSK31 or a USER slot, and on which sideband — is a menu item no
        CAT command reads.

        `WFM` is the one value that can appear in `state.mode` and never in
        `caps.modes`: those radios report wide FM in their status answer and
        have no command to select it, so it is readable and not settable. A
        client should render a mode it reads rather than assume it came from the
        capability list.
      enum:
        [UNKNOWN, LSB, USB, CW, CW-R, AM, FM, FSK, FSK-R, PSK, PSK-R, DV, DD, ATV,
         C4FM, C4FM-DN, C4FM-VW, WFM, DIG]

    VFO:
      type: string
      description: |
        `current` is the VFO the radio is operating and works everywhere.
        `A`/`B` (and their `main`/`sub` aliases) may be used only where
        `caps.vfos` lists them: naming one needs a protocol command that
        addresses a VFO by name, and on a radio without it remoses would have
        to act on the operating VFO and call it A, which it refuses to do.
      enum: [current, A, B, main, sub]

    VFOState:
      description: |
        One VFO's own settings. On a radio with `caps.per_vfo_mode` these are
        genuinely independent — an IC-7610 holds a separate mode, data-mode
        flag and IF filter per VFO — and elsewhere only `frequency` is
        meaningful.
      type: object
      properties:
        frequency: { type: integer, format: int64 }
        mode: { $ref: "#/components/schemas/Mode" }
        data_mode: { type: boolean }
        passband_hz: { type: integer }
        filter_slot: { type: integer }

    Power:
      description: |
        Transmit power in every form the backend can supply. The target rigs
        disagree about units and normalising that away would lose information:
        Kenwood PC is watts, Icom 14 0A is a relative index.
      type: object
      required: [pct, native]
      properties:
        watts:
          type: number
          nullable: true
          description: Absolute watts, null when the rig has no watt-accurate scale.
        pct:
          type: number
          description: Normalised 0..100 against the rig's maximum for the current mode.
        native:
          type: integer
          description: The value as it appears on the wire.

    PowerSet:
      description: Exactly one of watts or pct.
      type: object
      properties:
        watts: { type: number }
        pct: { type: number, minimum: 0, maximum: 100 }

    Meter:
      description: |
        An uncalibrated meter reading. Neither target rig reports dBm: Kenwood
        SM returns 0..30 meter dots, Icom 15 02 returns 0..255. `s` is present
        only where a per-model calibration table exists.
      type: object
      required: [raw, scale]
      properties:
        raw: { type: integer }
        scale: { type: integer }
        s: { type: number, nullable: true }

    CWStatus:
      type: object
      required: [busy, queued, wpm]
      properties:
        busy: { type: boolean }
        queued: { type: integer, description: Characters not yet keyed }
        wpm: { type: integer }
        est_remaining_ms: { type: integer }

    State:
      type: object
      required: [frequency, mode, ptt, connected, seq, updated_at]
      properties:
        frequency: { type: integer, format: int64, description: Hz }
        mode: { $ref: "#/components/schemas/Mode" }
        data_mode:
          type: boolean
          description: |
            Orthogonal to mode. Kenwood models it separately (MD + DA), so
            remoses does too rather than inventing DATA-U style pseudo-modes.
        passband_hz: { type: integer }
        filter_slot: { type: integer }
        power: { $ref: "#/components/schemas/Power" }
        ptt: { type: boolean }
        s_meter: { $ref: "#/components/schemas/Meter" }
        cw: { $ref: "#/components/schemas/CWStatus" }
        # The transmit meters — power_meter, swr, swr_ratio and alc — are
        # described further down, next to break_in.

        # The fields above describe the OPERATING VFO — the one the radio is
        # receiving on, and transmitting on unless split is set. They mean the
        # same on every radio, so a client that does not care about a second VFO
        # can stop reading here.
        vfo:
          allOf: [{ $ref: "#/components/schemas/VFO" }]
          description: |
            Which VFO the fields above describe. Not always switchable: on a
            classic single-receiver radio it follows the operator's A/B switch,
            while an IC-7610 has no such switch — its VFO A is always what it
            receives and transmits on, so this reads `A` permanently there and
            remoses offers no VFO-select operation for it.
        vfo_a: { $ref: "#/components/schemas/VFOState" }
        vfo_b: { $ref: "#/components/schemas/VFOState" }
        split:
          type: boolean
          description: |
            Transmit happens on the *other* VFO. The one flag here that changes
            where RF comes out, so a client showing a transmit frequency should
            read it rather than assuming the operating VFO.
        dual_watch:
          type: boolean
          description: Receiving on both VFOs at once.
        sub_s_meter:
          allOf: [{ $ref: "#/components/schemas/Meter" }]
          description: |
            The second receiver's signal level. Meaningful only while
            `dual_watch` is true: with it off that receiver is not running and
            remoses stops polling it rather than leaving a stale reading that
            would look live.

        power_meter:
          allOf: [{ $ref: "#/components/schemas/Meter" }]
          description: |
            Forward power out of the transmitter.

            **Absent in receive**, rather than zero: a transmitter that is not
            keyed has no forward power, and a client drawing 0 on a bar cannot
            tell "not transmitting" from "transmitting into a dead load". The
            same goes for `swr` and `alc`. All three appear when the radio
            reports itself keyed and vanish when it stops.

            `raw` and `scale` are in whatever units the radio's own meter uses —
            Icom counts 0-255, Kenwood counts meter dots — so compare the two
            rather than assuming either. Check `caps.power_meter` before
            offering the display at all.
        swr:
          allOf: [{ $ref: "#/components/schemas/Meter" }]
          description: |
            SWR as a meter deflection. Absent in receive; see `power_meter`.

            On an FT-857 or FT-897 this is one bit rather than a deflection —
            `scale` is 1 and `raw` is 0 or 1 — because a high-SWR alarm is all
            those radios report. The scale says so; do not assume a range.
        swr_ratio:
          type: number
          format: double
          description: |
            SWR as a number, where the radio's own documentation calibrates its
            meter well enough to say: 1.5, 2.0, 3.0.

            Absent on most radios, and absent rather than computed, because a
            deflection means nothing without the manufacturer's own scale and a
            ratio guessed from a linear fit would be a number remoses invented
            about somebody's antenna. Icom publishes four calibration points and
            gets a figure; Kenwood and Yaesu publish none and get only the bar.
            A rigctld rig reports a true ratio directly.

            Also absent above the top calibration point, where the curve is
            undocumented — the bar pins and this stops rather than extrapolating.
        alc:
          allOf: [{ $ref: "#/components/schemas/Meter" }]
          description: |
            ALC action. Absent in receive; see `power_meter`.

            Note that full scale is not always the data field's range: an Icom's
            ALC runs to 120 of a possible 255, and `scale` carries that.
        tuner:
          type: string
          enum: [off, on, tuning]
          description: |
            The internal antenna tuner: bypassed, in line, or running a tuning
            cycle. Absent on a radio that has none or that remoses cannot ask.

            `tuning` means the radio is keying its own transmitter right now to
            find a match, so a client should show it the way it shows PTT.

            On a TS-590S the state also reports whether a finished cycle
            succeeded, which no command does: a cycle that finds a match ends on
            `on`, one that fails ends on `off`. That is observed behaviour
            rather than something its reference promises, and it has not been
            checked on other families.
        break_in:
          type: string
          enum: [off, semi, full, on]
          description: |
            CW break-in. Absent on a radio remoses cannot ask. It decides
            whether CW sent over CAT reaches the air: with it off and the
            transmitter not already keyed, the rig accepts a message and
            transmits nothing. `POST /cw` will not let that happen silently —
            depending on the server's `cw.break_in` policy it either switches
            break-in on first or refuses with 422. A client offering a CW box
            should show this beside it, and may see it change by itself after a
            send for that reason.

            `on` means break-in is enabled on a radio that does not say which
            kind. Not every rig distinguishes them over CAT — an IC-910H's
            command is "0=OFF, 1=ON" where the rest of its family has three
            values — and reporting that as `semi` or `full` would invent a
            distinction the radio declined to make. It is an audible one: full
            is QSK and switches the rig between transmit and receive inside the
            gaps between elements. On such a radio, setting `semi` or `full` is
            still accepted, both mean its single "on", and the state reads back
            `on`.

        connected: { type: boolean }
        seq: { type: integer, format: int64 }
        updated_at: { type: string, format: date-time }
        age_ms: { type: integer }
        stale: { type: boolean }

    StatePatch:
      description: |
        Every field is optional. Applied in rig-safe order: mode before
        frequency, then split and dual watch, then PTT last — so a request that
        sets up the other VFO and enables split cannot key before the transmit
        frequency is where it was asked to be. Supplying both power_w and
        power_pct is a 422.

        `vfo` selects what `frequency`, `mode`, `data_mode` and `filter_slot`
        address. Omit it to act on whichever VFO the radio is operating, which
        is the only thing most radios can do; name `A` or `B` only where
        `caps.vfos` lists them. On a radio with `caps.per_vfo_mode` a naming
        request sets mode, data mode and filter in a single command, so those
        cannot disturb one another.
      type: object
      properties:
        frequency: { type: integer, format: int64 }
        mode: { $ref: "#/components/schemas/Mode" }
        data_mode: { type: boolean }
        vfo: { $ref: "#/components/schemas/VFO" }
        passband_hz: { type: integer }
        filter_slot: { type: integer }
        power_w: { type: number }
        power_pct: { type: number, minimum: 0, maximum: 100 }
        ptt: { type: boolean }
        split:
          type: boolean
          description: Needs `caps.split`; 422 otherwise.
        dual_watch:
          type: boolean
          description: Needs `caps.dual_watch`; 422 otherwise.
        break_in:
          type: string
          enum: [off, semi, full, on]
          description: |
            CW break-in. Needs `caps.break_in_control`; 422 otherwise. Applied
            before PTT, so a request that enables break-in and then sends does
            the two in the order that makes the first message audible.

            On a radio that only distinguishes off from on, `semi` and `full`
            both set its single "on" and the state reads back `on` — see
            `State.break_in`. `on` on a radio that does distinguish them selects
            `semi`, the quieter of the two.
        tuner:
          type: string
          enum: [off, on]
          description: |
            Switch the antenna tuner in or out of line. Needs
            `caps.tuner_control`; 422 otherwise.

            Only `off` and `on` are accepted. `tuning` is a state to observe,
            not one to ask for — start a cycle with `tuner_tune`.

            Applied before `ptt` and before `tuner_tune`, so a request that
            switches the tuner in and then tunes does the two in the order that
            works: a Kenwood will not begin a cycle with the tuner bypassed.
        tuner_tune:
          type: boolean
          description: |
            `true` starts a tuning cycle. **This transmits**: the radio keys
            itself for a second or two while it hunts for a match.

            An action rather than a state, and a separate field from `tuner` so
            that a client which reads the state and writes it back can never key
            a transmitter by echoing `"tuning"`. `false` is a 422 — there is
            nothing it could mean.

            Treated as a transmit operation throughout: it needs the lock, it is
            refused outside `limits.bands`, and it arms the transmit dead-man
            timer. It returns as soon as the radio accepts the command, not when
            the cycle ends; watch `state.tuner` for that.
        vfo_mode:
          type: boolean
          description: |
            `true` returns the radio to VFO operation, out of memory mode. An
            action rather than a state: remoses models no memory mode, so there
            is nothing to read back and `false` is a 422. Combine with `vfo` to
            select which VFO, where the radio has such a command. Applied before
            everything else, since a rig on a memory channel refuses much of the
            rest.

    Caps:
      type: object
      properties:
        modes:
          type: array
          items: { $ref: "#/components/schemas/Mode" }
        vfos:
          type: array
          items: { $ref: "#/components/schemas/VFO" }
        power_watt_accurate:
          type: boolean
          description: True when the rig's power scale is real watts.
        max_power_w: { type: number }
        filter_width: { type: boolean }
        filter_slots: { type: integer }
        s_meter_scale: { type: integer }
        sub_receiver:
          type: boolean
          description: |
            The radio has a second receiver that can listen at the same time as
            the first. Not merely "two VFOs" — nearly all of them have that.
            Whether remoses can *report* it is `sub_receiver_readable`.
        sub_receiver_readable:
          type: boolean
          description: |
            The second receiver's state can be read, so `state.sub_s_meter` is
            live. False on a radio that has one remoses cannot address: the
            IC-9700's sub band is reachable only by telling the radio to select
            it, which would move the operator's own focus, and remoses does not
            switch bands to fill in a meter.
        vfo_addressing:
          type: string
          enum: [named, relative]
          description: |
            What `state.vfo_a` and `state.vfo_b` name. `named` means stable
            labels for two fixed slots (an IC-7610's main and sub bands).
            `relative` means A is whichever VFO the operator has selected and B
            is the other — an IC-9700, whose protocol offers exactly that
            selector and never reports which letter is selected. Absent on a
            radio with a single addressable VFO. Either way, B is where split
            sends the transmit.
        split:
          type: boolean
          description: Transmit-on-the-other-VFO can be read and set.
        dual_watch:
          type: boolean
          description: Receiving on both VFOs at once can be switched.
        per_vfo_mode:
          type: boolean
          description: |
            Each VFO carries its own mode, data-mode flag and filter rather than
            only its own frequency. Where this is false, treat mode and filter
            as properties of the radio and read only `frequency` from
            `state.vfo_a` / `state.vfo_b`.
        power_meter:
          type: boolean
          description: |
            This radio can report forward power while transmitting. See
            `State.power_meter` for why the reading is absent in receive, and
            why this flag is the thing to check before drawing a meter panel.
        swr_meter:
          type: boolean
          description: |
            This radio can report SWR while transmitting — as a deflection in
            `State.swr`, as a ratio in `State.swr_ratio`, or both. True on an
            FT-857 too, where the "meter" is a single high-SWR bit.
        alc_meter:
          type: boolean
          description: This radio can report ALC action while transmitting.
        tuner_control:
          type: boolean
          description: |
            remoses can switch this radio's internal antenna tuner in and out of
            line, and read which it is.
        tuner_tune:
          type: boolean
          description: |
            remoses can start a tuning cycle on this radio. A client should
            treat it as a transmit control rather than a settings toggle: it
            keys the transmitter, and it is refused without the lock.
        ptt_control:
          type: boolean
          description: |
            remoses can key and unkey the transmitter on this radio.

            False is not exotic: the IC-706 family has no transmitter command in
            its control set at all, so PTT there is a footswitch, the microphone
            or a control line. Where this is false, `{"ptt": …}` returns 422 and
            `state.ptt` stays false because nothing reports it either — so a
            client should hide the control rather than show one that cannot key
            and a state that never changes.
        power_control:
          type: boolean
          description: |
            remoses can read and set RF output power. False where the radio has
            no power command and output is a front-panel control; `power_w` and
            `power_pct` are then refused with 422.
        break_in_control:
          type: boolean
          description: |
            remoses can read and set CW break-in on this radio. Worth checking
            before offering a CW box: where it is true, `state.break_in` says
            whether Morse sent now would actually be transmitted.

            `POST /cw` acts on that by itself. Under the default server-side
            `cw.break_in` policy it switches break-in on before sending, so a
            client need not; configured `manual` it refuses instead, with 422.
            Either way a message is never accepted and then silently not
            transmitted, which is what a rig with break-in off does on its own.
        cw_method:
          type: string
          enum: [none, cat, serial_key]
        cw_charset:
          type: string
          description: Characters this radio will key. Clients should validate against it.
        cw_min_wpm: { type: integer }
        cw_max_wpm: { type: integer }

    Limits:
      type: object
      properties:
        max_power_w: { type: number }
        max_power_pct: { type: number }
        tx_timeout_s: { type: integer }
        bands:
          type: array
          items: { type: string, example: 14.0-14.35MHz }

    Radio:
      type: object
      required: [id, name, backend, connected]
      properties:
        id: { type: string }
        name: { type: string }
        # yaesu covers both of Yaesu's CAT systems: the ASCII dialect the modern
        # radios speak and the five-byte binary one of the FT-857/FT-897
        # generation. The model chooses, so there is one backend name.
        backend: { type: string, enum: [civ, kenwood, yaesu, rigctld] }
        connected: { type: boolean }
        caps: { $ref: "#/components/schemas/Caps" }
        limits: { $ref: "#/components/schemas/Limits" }
        lock: { $ref: "#/components/schemas/LockState" }

    LockRequest:
      type: object
      properties:
        force:
          type: boolean
          description: Steal a held lock. Permitted only when enabled in configuration.

    Lock:
      type: object
      required: [token, expires_at, ttl_seconds]
      properties:
        token: { type: string }
        expires_at: { type: string, format: date-time }
        ttl_seconds: { type: integer }

    LockState:
      type: object
      required: [held]
      properties:
        held: { type: boolean }
        holder: { type: string }
        expires_at: { type: string, format: date-time }
        is_mine: { type: boolean }

    CWRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string
          description: Canonical form; `^AR` style prosigns.
          example: CQ TEST DE OH2XYZ ^AR
        wpm: { type: integer }
        mode:
          type: string
          enum: [append, replace]
          default: append

    CWAccepted:
      type: object
      required: [queued_chars]
      properties:
        queued_chars: { type: integer }
        position: { type: integer }
        est_duration_ms: { type: integer }

    WSTicket:
      type: object
      required: [ticket, expires_at]
      properties:
        ticket: { type: string }
        expires_at: { type: string, format: date-time }
